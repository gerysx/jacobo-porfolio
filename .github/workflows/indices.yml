name: Actualizar índices

on:
  schedule:
    - cron: "30 22 * * 1-5" # cada día laborable, tras el cierre de EE. UU.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-indices.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add src/data/indices.json
          git diff --cached --quiet || (git commit -m "Actualizar datos de índices" && git push)
